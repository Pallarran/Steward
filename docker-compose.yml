# Two services, app and db. There is deliberately no `jobs` service:
# Steward's collectors run inside the app process via instrumentation.ts,
# which is exactly why it must never run more than one instance. A second
# replica means every collector runs twice, and there is no leader election.
# Do not add `deploy.replicas` or a second app container.
#
# Horizon holds 3001 and 5433 on this machine, so Steward takes 3002 and 5434.

services:
  db:
    container_name: steward-db
    image: postgres:16-alpine
    restart: unless-stopped
    # Unraid keys the icon to the container name, so both services need it.
    labels:
      net.unraid.docker.icon: "${STEWARD_ICON_URL}"
    environment:
      POSTGRES_DB: steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Toronto
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Bound to loopback: the app reaches Postgres as db:5432 over the compose
    # network and never needs the published port. Change to "5434:5432" if you
    # want to point a GUI client at it from another machine.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      # -h localhost forces TCP. Without it pg_isready answers over the Unix
      # socket, which the init-phase bootstrap server also serves, so the app
      # can start against a Postgres that is not yet listening on the network.
      test: ["CMD-SHELL", "pg_isready -U steward -d steward -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: steward
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Unraid keys the icon to the container name and fetches this URL, so it
    # has to resolve when Steward itself is down. A raw GitHub URL, as Horizon
    # does.
    labels:
      net.unraid.docker.icon: "${STEWARD_ICON_URL}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://steward:${DB_PASSWORD}@db:5432/steward
      # Secure cookies off while Steward is reached over plain HTTP on the LAN.
      # Turn this off once every route in is HTTPS.
      ALLOW_HTTP: "true"
      TZ: America/Toronto
      NODE_ENV: production
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_PASSWORD: ${SEED_PASSWORD}
      KUMA_BASE_URL: ${KUMA_BASE_URL}
      KUMA_KEY: ${KUMA_KEY}
      TODOIST_TOKEN: ${TODOIST_TOKEN}
      HA_BASE_URL: ${HA_BASE_URL}
      HA_TOKEN: ${HA_TOKEN}
      HORIZON_BASE_URL: ${HORIZON_BASE_URL:-}
      HORIZON_API_KEY: ${HORIZON_API_KEY:-}
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL:-}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      UNRAID_STATE_DIR: ${UNRAID_STATE_DIR:-}
      HOST_PROC_DIR: ${HOST_PROC_DIR:-}
      BMC_BASE_URL: ${BMC_BASE_URL:-}
      BMC_USER: ${BMC_USER:-}
      BMC_PASSWORD: ${BMC_PASSWORD:-}
      # The local model. Unset means "not connected" and nothing calls it —
      # there is no default URL on purpose, so an install that has not been
      # pointed at Ollama does not read as one that is failing.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    volumes:
      # Unraid's own state, read-only — the same .ini files its webGUI reads to
      # draw the Dashboard. Steward runs on the machine it is reporting on, so
      # this needs no plugin, no API key and no Unraid Connect account.
      #
      # Read-only because Steward has no business writing here, and the mount
      # should say so rather than rely on the code being careful. Nothing else
      # under /var/local/emhttp is read: see src/lib/adapters/unraid.ts.
      - /var/local/emhttp:/host/emhttp:ro
      # The host's own /proc, read-only, for uptime, load and memory.
      #
      # Named explicitly rather than relying on the container's own /proc:
      # loadavg, meminfo and uptime are not namespaced and would read host-wide
      # either way, but a mount that says what it reads is the convention the
      # line above already set, and it survives someone later putting a memory
      # cgroup limit on this container.
      - /proc:/host/proc:ro
    ports:
      - "3002:3000"
